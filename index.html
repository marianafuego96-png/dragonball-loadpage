<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dragon Ball Z</title>

  <!-- tipografia -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Rubik:wght@400;500&display=swap" rel="stylesheet">

  <!-- ruta de estilos css, feedback profe  -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Titulos y subtitulos de la pagina home-->
  <header> 
    <h1>DRAGON BALL <span>Z</span></h1>
    <p>Explorá a los personajes de tu serie favorita</p>
  </header>

  <!-- Filtros por nombre y raza, imput de busqueda para el user -->
  <div class="filtros">
    <input type="text" id="buscarNombre" placeholder="Buscar por nombre...">
    <select id="filtrarRaza">
      <option value="">Todas las razas</option>
    </select>
  </div>

  <main>
    <div id="estado"></div>
    <div class="grid-tarjetas" id="grid"></div>

    
    <div class="paginacion oculto" id="paginacion">
      <button id="btnAnterior">← Anterior</button>
      <span id="infoPagina"></span>
      <button id="btnSiguiente">Siguiente →</button>
    </div>
  </main>

  <!-- tipos de modales homee -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-cerrar" id="modalCerrar" aria-label="Cerrar">&times;</button>
      <div id="modalContenido">
        <div class="modal-cargando">Cargando detalle...</div>
      </div>
    </div>
  </div>

  <!-- script al final del body , feedback profe  -->
  <script src="script.js"></script>

</body>
</html>
